<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="any" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />

		<!-- A hierarquia da página é feita de meio-pesos da Inter: se a fonte chega tarde,
		     chega tarde o desenho inteiro. O SvelteKit não preloada fonte sozinho. -->
		<link
			rel="preload"
			href="%sveltekit.assets%/fonts/inter-latin-wght-normal.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>

		%sveltekit.head%
	</head>
	<body>
		%sveltekit.body%
	</body>
</html>
